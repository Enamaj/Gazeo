name: GAZEO CI Pipeline

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gazeo-backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install GDAL & PostGIS Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin libgeos-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-django

      - name: Run Backend Tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: test-key-for-ci-pipeline
          DEBUG: "True"
        run: |
          if [ -f manage.py ]; then pytest; else echo "Backend not initialized yet"; fi

  mobile-tests:
    name: Flutter Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gazeo-mobile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies & Run Tests
        run: |
          if [ -f pubspec.yaml ]; then
            flutter pub get
            flutter test
          else
            echo "Flutter mobile app not initialized yet"
          fi
